<g text-anchor="middle">
<rect class="up" x="280" y="60" width="340" height="44" rx="22" fill="#ffffff" fill-opacity=".16"/>
<text class="up" x="450" y="90" fill="#ffffff" font-size="19" font-weight="700" letter-spacing="2.5">RED DE INSTALADORES QUMAX</text>
<text class="up d1" x="450" y="180" fill="#ffffff" font-size="66" font-weight="800">Tu socio para crecer</text>
<text class="up d1" x="450" y="254" fill="#ffffff" font-size="58" font-weight="800">en seguridad electrónica</text>
<text class="up d2" x="450" y="320" fill="#e6f4fb" font-size="29">Somos tu respaldo, no tu competencia.</text>
</g></svg>