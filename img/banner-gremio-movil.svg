<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 1060" width="900" height="1060" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#006aa3"/><stop offset=".55" stop-color="#0085c8"/><stop offset="1" stop-color="#0094dd"/></linearGradient>
 <radialGradient id="glow" cx="450" cy="700" r="420" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffffff" stop-opacity=".28"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
 <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#ffffff" opacity=".10"/></pattern>
 <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#00385a" flood-opacity=".28"/></filter>
</defs>
<style>
.ln{stroke:#ffffff;stroke-opacity:.55;stroke-width:2.5;stroke-dasharray:6 10;animation:fw 1.4s linear infinite}
@keyframes fw{to{stroke-dashoffset:-32}}
.nd{animation:fl 5s ease-in-out infinite} @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.lb{fill:#ffffff;font-size:25px;font-weight:600;text-anchor:middle}
.ring{transform-origin:450px 700px;animation:rg 3.2s ease-out infinite} .ring2{animation-delay:1.6s}
@keyframes rg{0%{transform:scale(.7);opacity:.6}100%{transform:scale(1.55);opacity:0}}
.orb{transform-origin:450px 700px;animation:sp 60s linear infinite} @keyframes sp{to{transform:rotate(360deg)}}
.up{animation:in 1s ease-out both} .d1{animation-delay:.15s} .d2{animation-delay:.3s} .d3{animation-delay:.45s}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style>
<rect width="900" height="1060" fill="url(#bg)"/><rect width="900" height="1060" fill="url(#dots)"/>
<circle cx="450" cy="700" r="420" fill="url(#glow)"/>
<g class="orb"><circle cx="450" cy="700" r="215" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="2" stroke-dasharray="2 12"/></g>
<path id="m0" d="M450,700 L450.0,485.0" class="ln"/><path id="m1" d="M450,700 L636.2,592.5" class="ln"/><path id="m2" d="M450,700 L636.2,807.5" class="ln"/><path id="m3" d="M450,700 L450.0,915.0" class="ln"/><path id="m4" d="M450,700 L263.8,807.5" class="ln"/><path id="m5" d="M450,700 L263.8,592.5" class="ln"/><circle class="ring" cx="450" cy="700" r="92" fill="none" stroke="#ffffff" stroke-width="3"/><circle class="ring ring2" cx="450" cy="700" r="92" fill="none" stroke="#ffffff" stroke-width="3"/>
<circle r="5" fill="#ffffff"><animateMotion dur="2.6s" begin="0.00s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#m0"/></animateMotion></circle><circle r="5" fill="#ffffff"><animateMotion dur="2.6s" begin="0.43s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#m1"/></animateMotion></circle><circle r="5" fill="#ffffff"><animateMotion dur="2.6s" begin="0.86s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#m2"/></animateMotion></circle><circle r="5" fill="#ffffff"><animateMotion dur="2.6s" begin="1.29s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#m3"/></animateMotion></circle><circle r="5" fill="#ffffff"><animateMotion dur="2.6s" begin="1.72s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#m4"/></animateMotion></circle><circle r="5" fill="#ffffff"><animateMotion dur="2.6s" begin="2.15s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#m5"/></animateMotion></circle><circle cx="450" cy="700" r="92" fill="#0077b3" stroke="#ffffff" stroke-width="5" filter="url(#sh)"/>
