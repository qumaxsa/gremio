name: Lista gremio (API)

on:
  schedule:
    - cron: "23 10-23 * * 1-6"   # cada hora de 7:23 a 20:23 (Argentina), lunes a sábado
    - cron: "23 13 * * 0"        # domingo 10:23
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["keys.json", "tools/**", "index.html", "alta.html", ".github/workflows/lista.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow openpyxl cryptography
      - uses: actions/cache@v4
        with:
          path: fotos_cache
          key: fotos-${{ github.run_id }}
          restore-keys: fotos-
      - name: Bajar datos de la API
        env:
          PROV_API_URL: ${{ secrets.PROV_API_URL }}
          PROV_API_KEY: ${{ secrets.PROV_API_KEY }}
        run: python3 -I tools/api_proveedor.py pkg.json fotos_cache
      - name: Generar lista
        env:
          GREMIO_SIN_EXCEL: "1"
          GREMIO_CON_HORA: "1"
        run: python3 -I tools/generar_lista_gremio.py pkg.json out
      - name: Armar sitio y cifrar
        run: |
          mkdir site
          cp -r .nojekyll robots.txt alta.html keys.json img landing site/
          cp out/index.html site/index.html
          python3 -I tools/gremio_crypto.py cifrar keys.json out/web_data_*.json site
          rm -f pkg.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
