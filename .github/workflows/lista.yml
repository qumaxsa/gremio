name: Lista gremio (API)

on:
  schedule:
    - cron: "23 10-23 * * 1-6"   # cada hora de 7:23 a 20:23 (Argentina), lunes a sábado
    - cron: "23 13 * * 0"        # domingo 10:23
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["keys.json", "tools/**", "index.html", "alta.html", "panel/**", ".github/workflows/lista.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow openpyxl cryptography
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: fotos_cache
          key: fotos-${{ github.run_id }}
          restore-keys: fotos-
      - name: Bajar datos de la API
        env:
          PROV_API_URL: ${{ secrets.PROV_API_URL }}
          PROV_API_KEY: ${{ secrets.PROV_API_KEY }}
        run: python3 -I tools/api_proveedor.py pkg.json fotos_cache
      - name: Generar lista
        env:
          GREMIO_SIN_EXCEL: "1"
          GREMIO_CON_HORA: "1"
        run: python3 -I tools/generar_lista_gremio.py pkg.json out
      - name: Armar sitio y cifrar
        run: |
          mkdir site
          cp -r .nojekyll robots.txt alta.html keys.json img landing panel site/
          cp out/index.html site/index.html
          cp -r out/f site/f
          python3 -I tools/gremio_crypto.py cifrar keys.json out/web_data_*.json site
          rm -f pkg.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site
          include-hidden-files: true   # conserva .nojekyll como antes
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
