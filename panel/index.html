<title>Qumax · Panel de pedidos gremio</title>
<style>
  html,body{margin:0;height:100%;background:#f4fafe;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#3d4752}
  iframe{display:block;border:0;width:100%;height:100%}
  #aviso{display:none;position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#fff;border:1px solid #e3eef6;border-radius:12px;box-shadow:0 6px 24px rgba(0,40,100,.15);padding:10px 16px;font-size:13px;z-index:2}

<body>
<!-- El panel es el Apps Script "Qumax Pedidos Gremio" (implementación del panel). Se muestra dentro de esta página

<iframe id="p" title="Panel de pedidos gremio" src="https://script.google.com/a/macros/qumax.com.ar/s/AKfycbz7hfmkCh7TXI8G6ItCni51S4RPNhzVJ5f79pjak2zKFi5sWJp7dQglq1I0PvDWm0iY9g/exec?panel"></iframe>
<div id="aviso">¿No carga el panel? Puede que tu navegador bloquee el inicio de sesión de Google dentro de la página. <a href="https://script.google.com/a/macros/qumax.com.ar/s/AKfycbz7hfmkCh7TXI8G6ItCni51S4RPNhzVJ5f79pjak2zKFi5sWJp7dQglq1I0PvDWm0iY9g/exec?panel" target="_top">Abrilo en pantalla completa</a> <button onclick="this.parentNode.remove()" aria-label="Cerrar" style="border:0;background:none;font-size:16px;cursor:pointer;color:#6b7280;margin-left:6px">×</button></div>
<script>setTimeout(function(){ document.getElementById("aviso").style.display = "block"; }, 8000);</script>
</body>
